<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pineapple Pie Recipe with Real Dial Scales</title>
  <style>
    body {
      background-color: #00ffff; /* Cyan background */
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: blue;
      font-size: 28px;
      margin-bottom: 30px;
    }

    h2 {
      color: blue;
      font-size: 22px;
      margin-top: 20px;
      margin-bottom: 15px;
    }

    .ingredient-list {
      list-style-type: disc;
      padding-left: 20px;
    }

    /* Interactive Item Styling */
    .ingredient-item {
      display: flex;
      justify-content: space-between;
      max-width: 380px;
      margin-bottom: 12px;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .ingredient-item:hover,
    .ingredient-item:active {
      background-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .label-red { color: red; }
    .label-green { color: green; }

    /* Button Styling */
    .weight-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: inherit;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .weight-btn:hover,
    .weight-btn:active {
      color: #d91e18;
      transform: scale(1.1);
    }

    .weight-red { color: red; }
    .weight-green { color: green; }

    /* Modal / Popup Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #ff7700; /* Orange Casing for Gram Scale */
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      width: 380px;
      max-width: 90%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      border: 4px solid #cc5500;
      box-sizing: border-box;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 28px;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
    }

    canvas {
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3);
    }

    /* Grid para sa Multi-Container Icon at Dual Scales */
    .icons-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      margin-top: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      max-height: 280px;
      overflow-y: auto;
    }

    .unit-box {
      width: 50px;
      height: 70px;
      border: 3px solid #333;
      border-radius: 6px;
      position: relative;
      background: #eee;
      overflow: hidden;
    }

    .unit-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: #ffd700;
      transition: height 0.8s ease;
    }

    .unit-label {
      position: absolute;
      width: 100%;
      top: 25px;
      font-size: 11px;
      color: #000;
      z-index: 2;
    }

    #display-text {
      font-size: 22px;
      color: #fff;
      margin-top: 15px;
      text-shadow: 1px 1px 2px #000;
    }

    /* Tip at Conversion Card */
    .conversion-note {
      font-size: 13px;
      color: #fff;
      background: rgba(0,0,0,0.35);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      line-height: 1.4;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <h1>PINEAPPLE PIE 1</h1>

  <h2>PABALAT</h2>

  <ul class="ingredient-list">
    <li class="ingredient-item">
      <span class="label-red">1st class</span>
      <button class="weight-btn weight-red" onclick="showKiloScale(10.5, '1st class (Harina)')">10 1/2 Kg</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">3rd class</span>
      <button class="weight-btn weight-green" onclick="showGramScale(100, '3rd class')">100 g</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Asukal</span>
      <button class="weight-btn weight-green" onclick="showGramScale(150, 'Asukal')">150 g</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Asin</span>
      <button class="weight-btn weight-green" onclick="showGramScale(8, 'Asin')">8 g</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Yeast</span>
      <button class="weight-btn weight-green" onclick="showMultiVolume(0.5, 'tbsp', 'Yeast')">1/2 tbsp</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Baking</span>
      <button class="weight-btn weight-green" onclick="showMultiVolume(0.5, 'tbsp', 'Baking Powder')">1/2 tbsp</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Tubig</span>
      <button class="weight-btn weight-green" onclick="showMultiVolume(0.75, 'can', 'Tubig (Pabalat)')">3/4 can</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Lard</span>
      <button class="weight-btn weight-green" onclick="showGramScale(25, 'Lard')">25 g</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Margarine</span>
      <button class="weight-btn weight-green" onclick="showGramScale(12, 'Margarine')">12 g</button>
    </li>
  </ul>

  <h2>PALAMAN</h2>
  <ul class="ingredient-list">
    <li class="ingredient-item">
      <span class="label-green">Asukal</span>
      <button class="weight-btn weight-green" onclick="showGramScale(400, 'Asukal (Palaman)')">400 g</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Tubig</span>
      <button class="weight-btn weight-green" onclick="showMultiVolume(4.5, 'can', 'Tubig (Palaman)')">4 1/2 can</button>
    </li>
    <li class="ingredient-item">
      <span class="label-green">Pineapple tang</span>
      <button class="weight-btn weight-green" onclick="showMultiVolume(0.5, 'pack', 'Pineapple Tang')">1/2 pack</button>
    </li>
  </ul>

  <!-- Modal / Popup -->
  <div id="scaleModal" class="modal">
    <div id="modalContent" class="modal-content">
      <span class="close-btn" onclick="closeScale()">&times;</span>
      <h3 id="ingredient-title" style="color: #fff; margin-top: 5px;">Sukat</h3>
      
      <!-- Canvas para sa Timbangan -->
      <canvas id="scaleCanvas" width="280" height="280" style="display:none;"></canvas>

      <!-- Multi-Container / Multi-Scale Grid -->
      <div id="iconsGrid" class="icons-grid" style="display:none;"></div>

      <div id="display-text">0</div>
      <div id="conversionNote" class="conversion-note"></div>
    </div>
  </div>

  <script>
    let currentWeight = 0;
    let targetWeight = 0;
    let animationFrame;

    // --- 1. ORANGE SCALE (1kg Gram Scale matching the Image) ---
    function draw1KgScale(grams) {
      const canvas = document.getElementById('scaleCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 125;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dial Base
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.fillStyle = '#fefefe';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#d0d0d0';
      ctx.stroke();

      // Green Target Highlight Arc
      let targetAngle = (targetWeight / 1000) * (2 * Math.PI) - (Math.PI / 2);
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 18, targetAngle - 0.12, targetAngle + 0.12);
      ctx.lineWidth = 16;
      ctx.strokeStyle = 'rgba(40, 167, 69, 0.45)';
      ctx.stroke();

      // Tick marks (200 ticks total, 5g each)
      for (let i = 0; i < 200; i++) {
        let angle = (i / 200) * (2 * Math.PI) - (Math.PI / 2);
        let val = i * 5;
        let isMajor = (val % 250 === 0);
        let isMedium = (val % 50 === 0 && !isMajor);

        let tickLen = isMajor ? 14 : (isMedium ? 9 : 5);

        let x1 = centerX + Math.cos(angle) * (radius - 4);
        let y1 = centerY + Math.sin(angle) * (radius - 4);
        let x2 = centerX + Math.cos(angle) * (radius - 4 - tickLen);
        let y2 = centerY + Math.sin(angle) * (radius - 4 - tickLen);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = isMajor ? 2.5 : (isMedium ? 1.5 : 1);
        ctx.strokeStyle = '#222';
        ctx.stroke();

        // Labels matching image: Large 250, 500, 750; Medium 50, 100, 150...
        if (isMajor) {
          let textX = centerX + Math.cos(angle) * (radius - 32);
          let textY = centerY + Math.sin(angle) * (radius - 32);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#111';
          ctx.font = 'bold 20px Arial';
          ctx.fillText(val === 0 ? 'g' : val.toString(), textX, textY);
        } else if (isMedium) {
          let textX = centerX + Math.cos(angle) * (radius - 24);
          let textY = centerY + Math.sin(angle) * (radius - 24);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#333';
          ctx.font = 'bold 11px Arial';
          ctx.fillText(val.toString(), textX, textY);
        }
      }

      ctx.font = 'bold 10px Arial';
      ctx.fillStyle = '#666';
      ctx.textAlign = 'center';
      ctx.fillText('CAP. 1kg   GRAD. 5g', centerX, centerY + 45);

      // Red Needle with Bulb Center
      let needleAngle = (grams / 1000) * (2 * Math.PI) - (Math.PI / 2);
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(needleAngle + Math.PI / 2);

      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-1.5, -(radius - 12));
      ctx.lineTo(1.5, -(radius - 12));
      ctx.lineTo(4, 0);
      ctx.closePath();
      ctx.fillStyle = '#e60000';
      ctx.fill();

      // Needle Bulb Center
      ctx.beginPath();
      ctx.arc(0, 20, 14, 0, 2 * Math.PI);
      ctx.fillStyle = '#e60000';
      ctx.fill();

      ctx.restore();
    }

    function animateGramNeedle() {
      let diff = targetWeight - currentWeight;
      if (Math.abs(diff) > 0.5) {
        currentWeight += diff * 0.1;
        draw1KgScale(currentWeight);
        animationFrame = requestAnimationFrame(animateGramNeedle);
      } else {
        currentWeight = targetWeight;
        draw1KgScale(currentWeight);
      }
    }

    function showGramScale(grams, ingredientName) {
      let modalContent = document.getElementById('modalContent');
      modalContent.style.backgroundColor = '#ff7700'; // Orange
      modalContent.style.borderColor = '#cc5500';

      document.getElementById('scaleModal').style.display = 'flex';
      document.getElementById('scaleCanvas').style.display = 'block';
      document.getElementById('iconsGrid').style.display = 'none';

      document.getElementById('ingredient-title').innerText = ingredientName;
      document.getElementById('display-text').innerText = grams + ' grams';

      let note = document.getElementById('conversionNote');
      note.innerText = `🟢 Tumingin sa GREEN ZONE sa timbangan.\nKapag tumapat doon ang pulang karayom, TAMA NA!`;
      note.style.display = 'block';

      currentWeight = 0;
      targetWeight = grams;
      cancelAnimationFrame(animationFrame);
      animateGramNeedle();
    }

    // --- 2. BLUE SCALE (10kg Master Scale matching Image) ---
    function draw10KgScale(canvasId, targetKilos) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#333';
      ctx.stroke();

      // Green Target Area
      let targetAngle = (targetKilos / 10) * (2 * Math.PI) - (Math.PI / 2);
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 15, targetAngle - 0.15, targetAngle + 0.15);
      ctx.lineWidth = 14;
      ctx.strokeStyle = 'rgba(40, 167, 69, 0.45)';
      ctx.stroke();

      // Numbers 1 to 10 and Ticks
      for (let i = 0; i < 10; i++) {
        let angle = (i / 10) * (2 * Math.PI) - (Math.PI / 2);
        
        // Draw Number
        let textX = centerX + Math.cos(angle) * (radius - 24);
        let textY = centerY + Math.sin(angle) * (radius - 24);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(i === 0 ? '0' : i.toString(), textX, textY);

        // Sub-divisions (1/4, 1/2, 3/4)
        for (let j = 1; j < 4; j++) {
          let subAngle = angle + (j / 4) * (2 * Math.PI / 10);
          let fracText = j === 1 ? '1/4' : (j === 2 ? '1/2' : '3/4');
          
          let fracX = centerX + Math.cos(subAngle) * (radius - 12);
          let fracY = centerY + Math.sin(subAngle) * (radius - 12);
          
          ctx.font = '8px Arial';
          ctx.fillStyle = '#b30000';
          ctx.fillText(fracText, fracX, fracY);
        }
      }

      ctx.font = 'bold 8px Arial';
      ctx.fillStyle = '#555';
      ctx.fillText('10kg SCALE', centerX, centerY + 30);

      // Needle
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(targetAngle);

      ctx.beginPath();
      ctx.moveTo(0, 10);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-1, -(radius - 12));
      ctx.lineTo(1, -(radius - 12));
      ctx.lineTo(3, 0);
      ctx.closePath();
      ctx.fillStyle = '#d91e18';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#990000';
      ctx.fill();

      ctx.restore();
    }

    // --- 3. DUAL SCALE DISPLAY FOR 10.5 KG ---
    function showKiloScale(kilos, ingredientName) {
      let modalContent = document.getElementById('modalContent');
      modalContent.style.backgroundColor = '#0066cc'; // Blue Casing
      modalContent.style.borderColor = '#004499';

      let totalGrams = kilos * 1000;
      let fullKilos = Math.floor(kilos); // 10 kg
      let remainingGrams = totalGrams - (fullKilos * 1000); // 500 g

      document.getElementById('scaleModal').style.display = 'flex';
      document.getElementById('scaleCanvas').style.display = 'none';
      
      let grid = document.getElementById('iconsGrid');
      grid.style.display = 'flex';
      grid.innerHTML = ''; 

      document.getElementById('ingredient-title').innerText = ingredientName;
      document.getElementById('display-text').innerText = fullKilos + ' Kilo + ' + remainingGrams + ' Gramo';

      // 1. Blue Scale (10kg)
      let mainKiloBox = document.createElement('div');
      mainKiloBox.style.textAlign = 'center';
      mainKiloBox.innerHTML = `
        <canvas id="kiloCanvas10" width="150" height="150"></canvas>
        <div style="color:#000; font-size:11px; margin-top:4px; font-weight:bold;">BLUE SCALE (MALAKI)<br>10 Kilo (Sagad)</div>
      `;
      grid.appendChild(mainKiloBox);

      // 2. Orange Scale (500g / Kalahating Kilo)
      if (remainingGrams > 0) {
        let gramBox = document.createElement('div');
        gramBox.style.textAlign = 'center';
        gramBox.innerHTML = `
          <canvas id="gramCanvasRem" width="150" height="150"></canvas>
          <div style="color:#000; font-size:11px; margin-top:4px; font-weight:bold;">ORANGE SCALE (MALIIT)<br>${remainingGrams}g (Kalahati)</div>
        `;
        grid.appendChild(gramBox);
      }

      setTimeout(() => {
        draw10KgScale('kiloCanvas10', 10);
        if (remainingGrams > 0) {
          targetWeight = remainingGrams;
          let canvas = document.getElementById('gramCanvasRem');
          if (canvas) {
            let tempCanvas = document.getElementById('scaleCanvas');
            document.getElementById('scaleCanvas').style.display = 'none';
            drawCustomGramScale('gramCanvasRem', remainingGrams);
          }
        }
      }, 100);

      let note = document.getElementById('conversionNote');
      note.style.display = 'block';
      note.innerText = `💡 PAANO TIMBANGIN:\n1️⃣ Patimbangin ang 10 Kilo sa Malaking Asul na Timbangan.\n2️⃣ Isunod ang natitirang 500g (Kalahating kilo) sa Orange Timbangan.`;
    }

    function drawCustomGramScale(canvasId, grams) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ccc';
      ctx.stroke();

      // Green Target Highlight
      let targetAngle = (grams / 1000) * (2 * Math.PI) - (Math.PI / 2);
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 12, targetAngle - 0.15, targetAngle + 0.15);
      ctx.lineWidth = 12;
      ctx.strokeStyle = 'rgba(40, 167, 69, 0.45)';
      ctx.stroke();

      // Numbers 250, 500, 750
      [250, 500, 750].forEach(val => {
        let angle = (val / 1000) * (2 * Math.PI) - (Math.PI / 2);
        let textX = centerX + Math.cos(angle) * (radius - 20);
        let textY = centerY + Math.sin(angle) * (radius - 20);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(val.toString(), textX, textY);
      });

      // Needle
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(targetAngle);

      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-1, -(radius - 10));
      ctx.lineTo(1, -(radius - 10));
      ctx.lineTo(3, 0);
      ctx.closePath();
      ctx.fillStyle = '#d91e18';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, 2 * Math.PI);
      ctx.fillStyle = '#990000';
      ctx.fill();

      ctx.restore();
    }

    // --- 4. MULTI-CONTAINER / LIQUID UNITS ---
    function showMultiVolume(amount, unit, ingredientName) {
      let modalContent = document.getElementById('modalContent');
      modalContent.style.backgroundColor = '#28a745'; // Green
      modalContent.style.borderColor = '#1e7e34';

      document.getElementById('scaleModal').style.display = 'flex';
      document.getElementById('scaleCanvas').style.display = 'none';
      
      let grid = document.getElementById('iconsGrid');
      grid.style.display = 'flex';
      grid.innerHTML = ''; 

      document.getElementById('ingredient-title').innerText = ingredientName;

      let fullCount = Math.floor(amount); 
      let remainder = amount - fullCount; 

      for (let i = 0; i < fullCount; i++) {
        grid.appendChild(createUnitBox(100, unit, 'BUO (' + (i + 1) + ')'));
      }

      if (remainder > 0) {
        let percent = remainder * 100;
        let fracLabel = remainder === 0.5 ? 'KALAHATI (1/2)' : (remainder === 0.25 ? '1/4' : (remainder === 0.75 ? '3
